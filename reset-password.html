<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Nueva contraseña · RPM Rosario</title>
<link rel="icon" href="assets/favicon.ico" sizes="48x48">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

<a href="index.html" class="logo auth-logo" aria-label="RPM Rosario - Inicio">
  <svg class="logo-mark" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g>
      <path d="M0 30 L28 27 L0 24" fill="var(--accent)"/>
      <path d="M8 34 L32 30.5 L8 27" fill="var(--accent)" opacity="0.6"/>
      <path d="M16 38 L36 34 L16 30" fill="var(--accent)" opacity="0.35"/>
    </g>
    <text x="34" y="42" class="logo-text-rpm">RPM</text>
  </svg>
  <span class="logo-sub">ROSARIO</span>
</a>

<main class="auth-wrap">
  <div class="auth-card">

    <!-- Verificando el link del mail -->
    <section class="auth-panel is-active" id="panel-checking">
      <p class="auth-subtitle">Verificando el link...</p>
    </section>

    <!-- Link inválido o vencido -->
    <section class="auth-panel" id="panel-invalid">
      <h2 class="auth-title">Link inválido o vencido</h2>
      <p class="auth-subtitle">Este link ya no sirve (vencen a la hora o se pueden usar una sola vez). Pedí uno nuevo desde la pantalla de inicio de sesión.</p>
      <a href="auth.html" class="btn btn-primary auth-submit auth-link-btn">VOLVER A INICIAR SESIÓN</a>
    </section>

    <!-- Formulario de nueva contraseña -->
    <section class="auth-panel" id="panel-reset">
      <h2 class="auth-title">Nueva contraseña</h2>
      <p class="auth-subtitle">Elegí una contraseña nueva para tu cuenta.</p>

      <form id="resetForm" class="auth-form" novalidate>
        <label class="auth-field">
          <span>Nueva contraseña</span>
          <input type="password" name="password" required autocomplete="new-password" placeholder="Mínimo 8 caracteres" minlength="8">
        </label>
        <label class="auth-field">
          <span>Confirmar contraseña</span>
          <input type="password" name="password_confirm" required autocomplete="new-password" placeholder="Repetí la contraseña">
        </label>

        <p class="auth-message" id="resetMessage" hidden></p>

        <button type="submit" class="btn btn-primary auth-submit">GUARDAR CONTRASEÑA</button>
      </form>
    </section>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
