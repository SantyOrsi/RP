<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foro · RPM Rosario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/foro.css">
</head>
<body class="auth-body">

<a href="index.html" class="logo auth-logo" aria-label="RPM Rosario - Inicio">
  <svg class="logo-mark" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g>
      <path d="M0 30 L28 27 L0 24" fill="var(--accent)"/>
      <path d="M8 34 L32 30.5 L8 27" fill="var(--accent)" opacity="0.6"/>
      <path d="M16 38 L36 34 L16 30" fill="var(--accent)" opacity="0.35"/>
    </g>
    <text x="34" y="42" class="logo-text-rpm">RPM</text>
  </svg>
  <span class="logo-sub">ROSARIO</span>
</a>

<!-- ===== Sin sesión ===== -->
<main class="foro-wrap" id="noSesionForo" hidden>
  <div class="foro-card foro-card--centrado">
    <p class="auth-subtitle">Iniciá sesión para participar en el foro.</p>
    <a href="auth.html" class="btn btn-primary">INICIAR SESIÓN</a>
  </div>
</main>

<!-- ===== Foro ===== -->
<main class="foro-wrap" id="foroContenido" hidden>

  <section class="foro-header">
    <h1>FORO RPM ROSARIO</h1>
    <button class="btn btn-primary" id="crearForoBtn">+ CREAR FORO</button>
  </section>

  <!-- Modal para crear foro -->
  <div id="modalCrearForo" class="modal" hidden>
    <div class="modal-content">
      <button class="modal-close" id="cerrarModal">&times;</button>
      <h2>CREAR NUEVO FORO</h2>
      <p class="auth-subtitle">⏰ El foro durará 7 días desde su creación</p>
      
      <form id="formCrearForo">
        <label for="categoriaSelect">Categoría:</label>
        <select id="categoriaSelect" required>
          <option value="">Selecciona una categoría...</option>
        </select>

        <label for="tituloInput">Título:</label>
        <input type="text" id="tituloInput" placeholder="Ej: Recomendaciones de mecánicos en Rosario" required maxlength="100">

        <label for="descripcionInput">Descripción:</label>
        <textarea id="descripcionInput" placeholder="Describe el tema del foro..." required rows="4" maxlength="500"></textarea>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">CREAR FORO</button>
        <p id="formMessage" class="auth-message" hidden></p>
      </form>
    </div>
  </div>

  <!-- Filtro por categoría -->
  <div class="foro-filtro">
    <button class="filtro-btn is-active" data-categoria="">Todos</button>
    <div id="filtroCategoriasContainer"></div>
  </div>

  <!-- Lista de foros -->
  <div id="listaForos" class="foro-lista">
    <!-- Se llena dinámicamente -->
  </div>

</main>

<!-- Modal para ver foro y posts -->
<div id="modalForo" class="modal" hidden>
  <div class="modal-content modal-foro">
    <button class="modal-close" id="cerrarModalForo">&times;</button>
    
    <section id="foroDetalles" class="foro-detalles">
      <span class="foro-categoria" id="foroCategoriaTag"></span>
      <h2 id="foroTitulo"></h2>
      <p id="foroDescripcion"></p>
      <p class="foro-meta" id="foroMeta"></p>
    </section>

    <!-- Posts -->
    <section class="foro-posts">
      <h3>CONVERSACIÓN</h3>
      <div id="listaPostsContainer">
        <!-- Se llena dinámicamente -->
      </div>

      <!-- Crear post -->
      <form id="formAgregarPost" class="foro-form-post">
        <textarea id="contenidoPost" placeholder="Escribe tu respuesta..." required maxlength="500" rows="3"></textarea>
        <button type="submit" class="btn btn-primary btn-sm">PUBLICAR</button>
        <p id="postMessage" class="auth-message" hidden></p>
      </form>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/foro.js"></script>
</body>
</html>
