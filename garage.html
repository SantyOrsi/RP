<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garage · RPM Rosario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/garage.css">
</head>
<body class="auth-body">

<a href="index.html" class="logo auth-logo" aria-label="RPM Rosario - Inicio">
  <svg class="logo-mark" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g>
      <path d="M0 30 L28 27 L0 24" fill="var(--accent)"/>
      <path d="M8 34 L32 30.5 L8 27" fill="var(--accent)" opacity="0.6"/>
      <path d="M16 38 L36 34 L16 30" fill="var(--accent)" opacity="0.35"/>
    </g>
    <text x="34" y="42" class="logo-text-rpm">RPM</text>
  </svg>
  <span class="logo-sub">ROSARIO</span>
</a>

<main class="garage-page-wrap">

  <section class="garage-page-header">
    <h1>GARAGE RPM ROSARIO</h1>
    <button class="btn btn-primary" id="publicarAutoBtn">+ PUBLICAR TU AUTO</button>
  </section>

  <!-- Buscador por modelo + filtro por marca -->
  <div class="garage-buscador">
    <input type="text" id="buscarModeloInput" placeholder="Buscar por modelo...">
  </div>
  <div class="garage-filtro" id="garageFiltroMarca">
    <button class="filtro-btn is-active" data-marca="">Todas las marcas</button>
    <!-- Se llena dinámicamente con las marcas que hay publicadas -->
  </div>

  <!-- Grilla de autos -->
  <div id="carCarousel" class="garage-grid">
    <!-- Se llena dinámicamente desde Supabase (js/garage.js) -->
  </div>

</main>

<!-- Modal para publicar un auto en el Garage -->
<div id="modalPublicarAuto" class="modal" hidden>
  <div class="modal-content">
    <button class="modal-close" id="cerrarModalGarage">&times;</button>
    <h2>PUBLICAR TU AUTO</h2>
    <p class="auth-subtitle" id="garageCupoTexto"></p>

    <form id="formPublicarAuto">
      <label for="garageMarcaInput">Marca:</label>
      <input type="text" id="garageMarcaInput" placeholder="Ej: BMW" required maxlength="40">

      <label for="garageTituloInput">Modelo / Título:</label>
      <input type="text" id="garageTituloInput" placeholder="Ej: E36 328i" required maxlength="60">

      <label for="garageUbicacionInput">Ubicación:</label>
      <input type="text" id="garageUbicacionInput" placeholder="Ej: Rosario" maxlength="60">

      <label for="garageDescripcionInput">Descripción:</label>
      <textarea id="garageDescripcionInput" placeholder="Contá algo sobre tu auto o proyecto..." rows="4" maxlength="500"></textarea>

      <label for="garageWhatsappInput">WhatsApp de contacto:</label>
      <input type="tel" id="garageWhatsappInput" placeholder="Ej: 5493415551234" required>

      <label for="garageImagenInput">Foto:</label>
      <input type="file" id="garageImagenInput" accept="image/*">

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">PUBLICAR</button>
      <p id="garageFormMessage" class="auth-message" hidden></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/garage.js"></script>
</body>
</html>
