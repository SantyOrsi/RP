<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión o unirte · RPM Rosario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

<a href="index.html" class="logo auth-logo" aria-label="RPM Rosario - Inicio">
  <svg class="logo-mark" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g>
      <path d="M0 30 L28 27 L0 24" fill="var(--accent)"/>
      <path d="M8 34 L32 30.5 L8 27" fill="var(--accent)" opacity="0.6"/>
      <path d="M16 38 L36 34 L16 30" fill="var(--accent)" opacity="0.35"/>
    </g>
    <text x="34" y="42" class="logo-text-rpm">RPM</text>
  </svg>
  <span class="logo-sub">ROSARIO</span>
</a>

<main class="auth-wrap">
  <div class="auth-card">

    <!-- Tabs: Iniciar sesión / Crear cuenta -->
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab is-active" data-tab="login" role="tab" aria-selected="true">INICIAR SESIÓN</button>
      <button class="auth-tab" data-tab="register" role="tab" aria-selected="false">CREAR CUENTA</button>
    </div>

    <!-- ===== LOGIN ===== -->
    <section class="auth-panel is-active" id="panel-login">
      <p class="auth-subtitle">Ingresá con tu email y contraseña.</p>

      <form id="loginForm" class="auth-form" novalidate>
        <label class="auth-field">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email" placeholder="tu@email.com">
        </label>
        <label class="auth-field">
          <span>Contraseña</span>
          <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </label>

        <p class="auth-message" id="loginMessage" hidden></p>

        <!-- Campo trampa anti-bot: invisible para personas, si llega completo se rechaza -->
        <div class="hp-field" aria-hidden="true">
          <label for="loginWebsite">No completar este campo</label>
          <input type="text" id="loginWebsite" name="website" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" class="btn btn-primary auth-submit">INICIAR SESIÓN</button>
      </form>
    </section>

    <!-- ===== REGISTRO ===== -->
    <section class="auth-panel" id="panel-register">
      <p class="auth-subtitle">Elegí cómo querés unirte a la comunidad.</p>

      <!-- Selector de tipo de cuenta -->
      <div class="account-type" role="radiogroup" aria-label="Tipo de cuenta">
        <button type="button" class="account-type-btn is-active" data-account-type="particular" role="radio" aria-checked="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
          PARTICULAR
        </button>
        <button type="button" class="account-type-btn" data-account-type="concesionaria" role="radio" aria-checked="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V10l9-6 9 6v11"/><path d="M9 21v-6h6v6"/></svg>
          CONCESIONARIA
        </button>
      </div>

      <form id="registerForm" class="auth-form" novalidate>
        <input type="hidden" name="account_type" value="particular">

        <!-- Solo para Concesionaria -->
        <label class="auth-field" id="fieldRazonSocial" hidden>
          <span>Razón social</span>
          <input type="text" name="razon_social" autocomplete="organization" placeholder="Ej: Automotores del Litoral S.A.">
        </label>

        <!-- Solo para Particular -->
        <div id="fieldDatosPersonales">
          <label class="auth-field">
            <span>Nombre</span>
            <input type="text" name="nombre" required autocomplete="given-name" placeholder="Tu nombre">
          </label>
          <label class="auth-field">
            <span>Apellido</span>
            <input type="text" name="apellido" required autocomplete="family-name" placeholder="Tu apellido">
          </label>

          <div class="doc-type" role="radiogroup" aria-label="Tipo de documento">
            <button type="button" class="doc-type-btn is-active" data-doc-type="dni" role="radio" aria-checked="true">DNI</button>
            <button type="button" class="doc-type-btn" data-doc-type="cuit" role="radio" aria-checked="false">CUIT</button>
          </div>
          <input type="hidden" name="documento_tipo" value="dni">

          <label class="auth-field">
            <span id="documentoLabel">DNI</span>
            <input type="text" name="documento" id="documentoInput" required inputmode="numeric" autocomplete="off" placeholder="Ej: 30123456" maxlength="8" pattern="[0-9]*">
          </label>
        </div>

        <label class="auth-field">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email" placeholder="tu@email.com">
        </label>
        <label class="auth-field">
          <span>* Provincia</span>
          <select name="provincia" id="provinciaInput" required>
            <option value="">Seleccionar</option>
            <option>Buenos Aires</option>
            <option>Catamarca</option>
            <option>Chaco</option>
            <option>Chubut</option>
            <option>Ciudad Autónoma de Buenos Aires</option>
            <option>Córdoba</option>
            <option>Corrientes</option>
            <option>Entre Ríos</option>
            <option>Formosa</option>
            <option>Jujuy</option>
            <option>La Pampa</option>
            <option>La Rioja</option>
            <option>Mendoza</option>
            <option>Misiones</option>
            <option>Neuquén</option>
            <option>Río Negro</option>
            <option>Salta</option>
            <option>San Juan</option>
            <option>San Luis</option>
            <option>Santa Cruz</option>
            <option>Santa Fe</option>
            <option>Santiago del Estero</option>
            <option>Tierra del Fuego</option>
            <option>Tucumán</option>
          </select>
        </label>
        <label class="auth-field">
          <span>Ciudad</span>
          <select name="ciudad" id="ciudadInput" autocomplete="address-level2" disabled>
            <option value="">Seleccionar</option>
          </select>
        </label>
        <div class="auth-phone-row">
          <label class="auth-field auth-phone-prefix">
            <span>* Prefijo</span>
            <input type="tel" name="prefijo" id="prefijoInput" required autocomplete="tel-area-code" placeholder="OBLIGATORIO" inputmode="numeric" pattern="[0-9]{2,5}" maxlength="5">
          </label>
          <label class="auth-field">
            <span>* Teléfono móvil <b>(Obligatorio)</b></span>
            <input type="tel" name="telefono_movil" id="telefonoMovilInput" required autocomplete="tel-national" placeholder="Ej: 15 1234567" inputmode="numeric" pattern="[0-9]{6,10}" maxlength="10">
          </label>
        </div>
        <label class="auth-field">
          <span>Contraseña</span>
          <input type="password" name="password" required autocomplete="new-password" placeholder="Mínimo 8 caracteres" minlength="8">
        </label>
        <label class="auth-field">
          <span>Confirmar contraseña</span>
          <input type="password" name="password_confirm" required autocomplete="new-password" placeholder="Repetí la contraseña">
        </label>

        <p class="auth-message" id="registerMessage" hidden></p>

        <!-- Campo trampa anti-bot: invisible para personas, si llega completo se rechaza -->
        <div class="hp-field" aria-hidden="true">
          <label for="registerWebsite">No completar este campo</label>
          <input type="text" id="registerWebsite" name="website" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" class="btn btn-primary auth-submit">CREAR CUENTA</button>
        <p class="auth-fineprint">Al crear tu cuenta te vamos a enviar un mail para confirmarla.</p>
      </form>
    </section>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth-debug.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
